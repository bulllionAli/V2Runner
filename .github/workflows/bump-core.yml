name: Bump AndroidLibXrayLite

on:
  workflow_dispatch:
    inputs:
      core_tag:
        description: 'AndroidLibXrayLite tag to pin (e.g. v26.9.1-P)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Verify the release asset exists
        run: |
          curl -fsIL -o /dev/null "https://github.com/patterniha/AndroidLibXrayLite/releases/download/${{ inputs.core_tag }}/libv2ray.aar" \
            || { echo "::error::patterniha/AndroidLibXrayLite has no libv2ray.aar release asset for tag '${{ inputs.core_tag }}' - create the release first"; exit 1; }

      - name: Bump submodule pointer
        run: |
          cd AndroidLibXrayLite
          git fetch origin --tags
          git checkout "${{ inputs.core_tag }}"
          DESCRIBED=$(git describe --tags --abbrev=0)
          if [ "$DESCRIBED" != "${{ inputs.core_tag }}" ]; then
            echo "::error::Checked-out commit describes as '$DESCRIBED', not '${{ inputs.core_tag }}'"
            exit 1
          fi
          cd ..
          if git diff --quiet AndroidLibXrayLite; then
            echo "Submodule already at ${{ inputs.core_tag }} - nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AndroidLibXrayLite
          git commit -m "chore: bump AndroidLibXrayLite to ${{ inputs.core_tag }}"
          git push origin HEAD:${{ github.ref_name }}
